access:
  type: observed_undocumented
  transport_readiness: ready_for_transport
  primary:
    name: Archivo de boletines del Portal BOP
    retrieval_contract: observed_undocumented_jsf_ajax
    direct_entry_url: https://bop.dipcas.es/PortalBOP/boletinesAntiguos/
    navigation_entry_url: https://bop.dipcas.es/PortalBOP/buscador/
    method_sequence:
      - GET direct_entry_url with a fresh CookieJar and form ViewState
      - POST date search; parse JSF partial-response update formListBoletinAntiguos
      - POST PrimeFaces selection using the source component derived from the matched issue card
      - parse JSF redirect and GET the validated same-origin announcements route using the same CookieJar
    successful_issue_request_count: 4
    form:
      id: buscadorForm
      method: POST
      action: /PortalBOP/boletinesAntiguos/;jsessionid={session}
      date_format: dd/mm/YYYY
      edition_number_field: buscadorForm:numBoletinAntiguo
      date_start_field: buscadorForm:fechaInicialAntiguo_input
      date_end_field: buscadorForm:fechaFinalAntiguo_input
      submit_name: buscadorForm:j_idt152
      required_hidden_fields:
        - buscadorForm
        - javax.faces.ViewState
      ajax: true
      response_content_type: text/xml;charset=UTF-8
      updated_result_component: formListBoletinAntiguos
    announcement_navigation:
      selection_component: derived_from_matched_issue_card
      selection_partial_execute: "@all"
      selection_response: jsf_partial_redirect
      destination: validated_same_origin_path_under_PortalBOP
      announcements_container_id: busquedaBoletinesForm:resultadoBusquedaBoletines
      download_component_class: linkDownloadFileCurrentAnuncioIcon
      title_class: titulo4
      observed_interstitial_sibling: script
      pairing: local_following_title_before_next_announcement_download
      bulletin_download_class_excluded: linkDownloadFileCurrentBoletinIcon
    session:
      cookies_observed:
        - JSESSIONID
        - TS019819ec
        - TS01dc4fc6
      view_state: fresh_per_get_per_form
      cookie_values_versioned: false
    documented_api: false
    format: html
    observed_content_type: text/html;charset=UTF-8
    ajax_transport_content_type: text/xml;charset=UTF-8
    pagination: not_verified
    date_query_contract: observed_reproducible
    observed_date_to_edition_mappings:
      - requested_date: "2026-09-24"
        displayed_edition_number: "115"
        displayed_edition_code: B260924
        idBoletin: "26878"
      - requested_date: "2026-09-22"
        displayed_edition_number: "114"
        displayed_edition_code: B260922
        idBoletin: "26877"
  downloads:
    - name: Boletín completo
      type: observed_undocumented
      method: GET
      url_template: https://bop.dipcas.es/PortalBOP/api/descargarBoletin?idBoletin={idBoletin}&idioma={idioma}
      response_body: not_requested
    - name: Anuncio individual
      type: observed_undocumented
      method: GET
      url_template: https://bop.dipcas.es/PortalBOP/api/descargarAnuncio?idAnuncio={idAnuncio}&idioma={idioma}
      observed_head_status: 200
      observed_content_type: application/octet-stream; charset=UTF-8
      observed_content_disposition_suffix: .pdf
      response_body: not_downloaded

formats:
  preferred: html
