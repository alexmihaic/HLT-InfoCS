name: BDNS v1-v2 baseline migration

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bdns-collection-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Prepare entire batch outside the repository
        id: prepare
        shell: bash
        run: |
          base_sha="$(git rev-parse HEAD)"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          python -m infocs.fetch.bdns.migration inventory
          set +e
          python -m infocs.fetch.bdns.migration prepare \
            --git-sha "$base_sha" --staged-data-root "$RUNNER_TEMP/bdns-v2-data" \
            > "$RUNNER_TEMP/bdns-migration-result.json"
          prepare_rc=$?
          set -e
          export PREPARE_RC="$prepare_rc"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          counts = (
              "inventory_count", "fresh_detail_count", "summary_resolved_count",
              "v1_match_count", "v2_prepared_count", "privacy_allowed_count",
              "publication_approved_count", "authorization_count", "evidence_count",
              "request_count",
          )
          keys = ("status", "migration_id", *counts, "safe_reason")
          reasons = {
              "migration_invalid_inventory", "migration_v1_source_drift",
              "migration_summary_not_resolved", "migration_detail_failure",
              "migration_enrichment_blocked", "migration_privacy_blocked",
              "migration_publication_blocked", "migration_evidence_conflict",
              "migration_mixed_hash_versions", "migration_cutover_marker_invalid",
              "migration_incomplete_batch", "migration_budget_exhausted",
              "migration_invalid_staging", "migration_attribution_blocked",
              "migration_preflight_failed", "migration_invalid_timestamp",
          }
          try:
              raw = json.loads((Path(os.environ["RUNNER_TEMP"]) / "bdns-migration-result.json").read_text(encoding="utf-8"))
              if not isinstance(raw, dict) or not set(keys).issubset(raw):
                  raise ValueError
              # Unknown fields are never forwarded, even if a future CLI adds them.
              result = {key: raw[key] for key in keys}
              status = result["status"]
              rc = int(os.environ["PREPARE_RC"])
              if status not in ("prepared", "already_migrated", "blocked"):
                  raise ValueError
              if (status == "blocked" and rc != 1) or (status != "blocked" and rc != 0):
                  raise ValueError
              if not isinstance(result["migration_id"], str) or not re.fullmatch(r"bdns-v1-v2-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}", result["migration_id"]):
                  raise ValueError
              if any(type(result[key]) is not int or result[key] < 0 for key in counts):
                  raise ValueError
              reason = result["safe_reason"]
              if status == "blocked":
                  if not isinstance(reason, str) or reason not in reasons:
                      raise ValueError
              elif reason is not None:
                  raise ValueError
          except Exception:
              result = {"status": "blocked", "safe_reason": "migration_safe_result_invalid"}
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("prepared=false\nstatus=blocked\nsafe_reason=migration_safe_result_invalid\n")
              print("BDNS_MIGRATION_SAFE_RESULT=" + json.dumps(result, separators=(",", ":")))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write("## BDNS migration preparation\n\nStatus: blocked\n\nSafe reason: migration_safe_result_invalid\n")
              raise SystemExit(1)
          print("BDNS_MIGRATION_SAFE_RESULT=" + json.dumps(result, separators=(",", ":")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("prepared=" + str(status == "prepared").lower() + "\n")
              handle.write(f"status={status}\nsafe_reason={reason or ''}\nrequest_count={result['request_count']}\n")
          labels = ("Inventory", "Fresh details", "Summaries resolved", "V1 matches",
                    "V2 prepared", "Privacy allowed", "Publication approved",
                    "Authorizations", "Evidence", "Requests")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(f"## BDNS migration preparation\n\nStatus: {status}\n\n")
              for label, key in zip(labels, counts, strict=True):
                  handle.write(f"- {label}: {result[key]}\n")
              handle.write(f"\nSafe reason: {reason or 'none'}\n")
          PY
          exit "$prepare_rc"
      - name: Materialize validated batch and publish single cutover commit
        id: publish
        if: steps.prepare.outputs.prepared == 'true'
        env:
          BASE_SHA: ${{ steps.prepare.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -m infocs.fetch.bdns.migration materialize --staged-data-root "$RUNNER_TEMP/bdns-v2-data"
          git add -- data/records/bdns/ data/migrations/bdns/v1-v2/
          git diff --cached --check
          python -m infocs.fetch.bdns.migration validate-git --base-ref "$BASE_SHA"
          git fetch origin main --no-tags
          python -m infocs.fetch.bdns.workflow_safety validate-remote --base-sha "$BASE_SHA"
          remote_sha="$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(bdns): migrate canonical records to v2 baseline"
          if [[ "$remote_sha" != "$BASE_SHA" ]]; then
            git rebase origin/main
          fi
          python -m infocs.fetch.bdns.migration validate-git --base-ref HEAD^ --commit HEAD
          git diff --check
          git push origin HEAD:main
          echo "commit_created=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch Pages after successful migration push
        if: steps.publish.outputs.commit_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" -f ref=main
