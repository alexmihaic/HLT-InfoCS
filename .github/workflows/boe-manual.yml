name: BOE manual collection

on:
  workflow_dispatch:
    inputs:
      date:
        description: Fecha BOE en formato YYYY-MM-DD
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: boe-collection-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install InfoCs runtime
        run: python -m pip install -e .

      - name: Run BOE collection
        id: collection
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set +e
          python -m infocs.fetch.boe.runner --date "$REQUESTED_DATE"
          runner_code=$?
          echo "exit_code=$runner_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate generated data artifacts
        run: python -m infocs.fetch.boe.workflow_safety

      - name: Stage only canonical data
        shell: bash
        run: |
          git add -- data/records data/events data/manifests data/health
          git diff --cached --check

      - name: Commit and push data when changed
        id: publish
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "commit_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main --no-tags
          remote_main=$(git rev-parse origin/main)
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "origin/main advanced since this run started; refusing to publish." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(boe): collect ${REQUESTED_DATE}"
          echo "commit_created=true" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Propagate collection failure after observability publication
        if: always() && steps.collection.outputs.exit_code != '0'
        run: exit 1
