name: BDNS collection

on:
  workflow_dispatch:
    inputs:
      run_class:
        description: Clase de ejecución BDNS
        required: true
        type: choice
        options:
          - discovery
          - incremental_update
          - complete_scope
      fecha_desde:
        description: Ventana temporal de consulta BDNS — desde (YYYY-MM-DD). En incremental_update se usa como fecha inicial sólo si no existe checkpoint compatible.
        required: true
        type: string
      fecha_hasta:
        description: Ventana temporal de consulta BDNS — hasta (YYYY-MM-DD); no es una fecha de publicación.
        required: true
        type: string
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Madrid'

permissions:
  contents: write
  actions: write

concurrency:
  group: bdns-collection-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "BDNS collection is allowed only from refs/heads/main." >&2
            exit 1
          fi

      - name: Checkout base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record base SHA
        id: base
        shell: bash
        run: |
          base_sha="$(git rev-parse HEAD)"
          if [[ "$base_sha" != "$GITHUB_SHA" ]]; then
            echo "Checkout does not match the triggering commit." >&2
            exit 1
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install InfoCs runtime
        run: python -m pip install -e .

      - name: Resolve effective parameters and validate preflight before network access
        id: params
        env:
          RUN_CLASS: ${{ inputs.run_class }}
          FECHA_DESDE: ${{ inputs.fecha_desde }}
          FECHA_HASTA: ${{ inputs.fecha_hasta }}
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              python -m infocs.fetch.bdns.workflow_safety validate-inputs \
                --run-class "$RUN_CLASS" \
                --from-date "$FECHA_DESDE" \
                --through-date "$FECHA_HASTA"
              {
                echo "run_class=$RUN_CLASS"
                echo "from_date=$FECHA_DESDE"
                echo "through_date=$FECHA_HASTA"
                echo "trigger=workflow_dispatch"
              } >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              python -m infocs.fetch.bdns.workflow_safety prepare-scheduled \
                --github-output "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported BDNS event." >&2
              exit 1
              ;;
          esac

      - name: Run BDNS collector and preserve its result
        id: collection
        env:
          RUN_CLASS: ${{ steps.params.outputs.run_class }}
          FECHA_DESDE: ${{ steps.params.outputs.from_date }}
          FECHA_HASTA: ${{ steps.params.outputs.through_date }}
          TRIGGER: ${{ steps.params.outputs.trigger }}
        shell: bash
        run: |
          stdout_file="$RUNNER_TEMP/bdns-runner-stdout.json"
          stderr_file="$RUNNER_TEMP/bdns-runner-stderr.txt"
          result_file="$RUNNER_TEMP/bdns-validated-result.json"
          : > "$stdout_file"
          : > "$stderr_file"

          runner_args=(--mode "$RUN_CLASS" --through-date "$FECHA_HASTA")
          if [[ "$TRIGGER" == "workflow_dispatch" ]]; then
            if [[ "$RUN_CLASS" == "incremental_update" ]]; then
              runner_args+=(--initial-from-date "$FECHA_DESDE")
            else
              runner_args+=(--from-date "$FECHA_DESDE")
            fi
          fi

          set +e
          python -m infocs.fetch.bdns.runner "${runner_args[@]}" > "$stdout_file" 2> "$stderr_file"
          runner_code=$?
          set -e

          echo "exit_code=$runner_code" >> "$GITHUB_OUTPUT"
          python -m infocs.fetch.bdns.workflow_safety validate-result \
            --stdout-file "$stdout_file" \
            --stderr-file "$stderr_file" \
            --exit-code "$runner_code" \
            --github-summary "$GITHUB_STEP_SUMMARY" > "$result_file"

      - name: Validate and stage only canonical BDNS artifacts
        run: python -m infocs.fetch.bdns.workflow_safety stage --result-file "$RUNNER_TEMP/bdns-validated-result.json"

      - name: Commit and publish BDNS artifacts
        id: publish
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          RUN_CLASS: ${{ steps.params.outputs.run_class }}
          FECHA_DESDE: ${{ steps.params.outputs.from_date }}
          FECHA_HASTA: ${{ steps.params.outputs.through_date }}
          TRIGGER: ${{ steps.params.outputs.trigger }}
        shell: bash
        run: |
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "commit_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main --no-tags
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$BASE_SHA" ]]; then
            python -m infocs.fetch.bdns.workflow_safety validate-remote \
              --base-sha "$BASE_SHA" --remote-ref origin/main
          fi
          echo "expected_remote_sha=$remote_sha" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$TRIGGER" == "schedule" ]]; then
            git commit -m "data(bdns): scheduled incremental through ${FECHA_HASTA}"
          else
            git commit -m "data(bdns): run ${RUN_CLASS} ${FECHA_DESDE}..${FECHA_HASTA}"
          fi

          if [[ "$remote_sha" != "$BASE_SHA" ]]; then
            git rebase origin/main
          fi

          python -m infocs.fetch.bdns.workflow_safety validate-commit \
            --commit HEAD \
            --result-file "$RUNNER_TEMP/bdns-validated-result.json"

          git fetch origin main --no-tags
          remote_now="$(git rev-parse origin/main)"
          head_parent="$(git rev-parse HEAD^)"
          if [[ "$remote_now" != "$remote_sha" || "$head_parent" != "$remote_sha" ]]; then
            echo "origin/main advanced again; refusing to push BDNS artifacts." >&2
            exit 1
          fi
          git push origin HEAD:main
          echo "commit_created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Pages after published BDNS data
        if: steps.publish.outputs.commit_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches"

      - name: Propagate original runner result after safe publication
        if: always() && steps.collection.outputs.exit_code != ''
        env:
          RUNNER_EXIT_CODE: ${{ steps.collection.outputs.exit_code }}
        shell: bash
        run: exit "$RUNNER_EXIT_CODE"
